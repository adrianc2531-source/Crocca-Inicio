<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CROCCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #7A8450;
    --rosa: #FAD1D9;
    --crema: #F2EDE4;
    --tinta: #4E5832;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; background-color: var(--crema);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .48  0 0 0 0 .52  0 0 0 0 .31  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    color: var(--tinta);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; min-height: 100vh; }


  .marca { text-align: center; padding: 72px 32px 8px; }
  .marca img.logo { width: min(300px, 78%); height: auto; display: block; margin: 0 auto; }
  .marca p { margin: 16px 0 0; font-size: 21px; font-style: italic; font-weight: 500; color: var(--tinta); letter-spacing: .02em; }

  .redes { display: flex; align-items: stretch; justify-content: center; margin: 44px 24px 0; }
  .red {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: var(--tinta); text-decoration: none; font-size: 26px; font-weight: 500; padding: 8px 4px;
    border-radius: 16px;
  }
  .red svg { width: 84px; height: 84px; padding: 19px; border-radius: 50%; background: var(--rosa); color: var(--verde); transition: transform .15s ease; }
  .red:hover svg { transform: scale(1.08); }
  .red:focus-visible, .menu:focus-visible { outline: 3px solid var(--verde); outline-offset: 4px; }
  .sep { width: 1.5px; background: var(--verde); opacity: .6; margin: 6px 0; }

  .hint { margin: 36px auto 0; width: fit-content; max-width: calc(100% - 48px); text-align: center; font-style: italic; font-size: 20px; font-weight: 600; color: var(--tinta); letter-spacing: .02em; padding: 3px 16px; background: var(--rosa); border-radius: 999px; }
  .hint svg { width: 16px; height: 16px; vertical-align: -2px; margin-right: 6px; }

  .redes { margin-top: 20px; }

  .menu { display: block; margin: 40px 24px 0; padding: 10px 0 6px; color: var(--verde); text-decoration: none; text-align: center; border-radius: 16px; }
  .menu .fila { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .menu .linea { flex: 1; height: 1.5px; background: var(--verde); opacity: .85; }
  .menu .estrella { width: 24px; height: 24px; color: var(--verde); flex: none; transition: transform .2s ease; }
  .menu .txt { font-size: 60px; line-height: 1; letter-spacing: .03em; font-weight: 600; }
  .menu .sub { display: block; width: fit-content; margin: 12px auto 0; padding: 3px 16px; background: var(--rosa); border-radius: 999px; font-style: italic; font-size: 19px; font-weight: 600; color: var(--tinta); }
  .menu:hover .estrella { transform: rotate(45deg) scale(1.15); }

  .pie { margin-top: auto; padding: 48px 24px 32px; text-align: center; }
  .pie img { width: 44px; height: auto; }

  @media (prefers-reduced-motion: reduce) { .red svg, .menu .estrella { transition: none; } }
</style>
</head>
